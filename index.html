<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paisa">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Paisa Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --accent: #38bdf8;
    --accent2: #a78bfa;
    --green: #34d399;
    --danger: #f87171;
    --warn: #fbbf24;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --r: 14px;
    --rs: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding-bottom: 80px; overscroll-behavior: none; }
  .header { background: var(--surface); padding: 16px 20px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header h1 span { color: var(--accent); }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 61px; z-index: 99; }
  .tab { flex: 1; padding: 12px 0; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .page { display: none; padding: 14px; }
  .page.active { display: block; }
  .card { background: var(--surface); border-radius: var(--r); padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
  .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--surface2); border-radius: var(--rs); padding: 12px; }
  .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat-val { font-size: 20px; font-weight: 700; }
  .c-accent { color: var(--accent); }
  .c-green { color: var(--green); }
  .c-warn { color: var(--warn); }
  .c-purple { color: var(--accent2); }
  .c-danger { color: var(--danger); }
  .c-text { color: var(--text); }
  .prog-wrap { margin-bottom: 10px; }
  .prog-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .prog-bar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
  .pf-fuel { background: var(--accent); }
  .pf-save { background: var(--green); }
  .form-group { margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  input[type=number], input[type=text], select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--rs); padding: 11px 12px;
    font-size: 15px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--surface2); }
  .chk-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .chk-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .chk-row label { margin: 0; font-size: 13px; color: var(--text); cursor: pointer; }
  .btn { border: none; border-radius: var(--rs); padding: 13px 20px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: opacity 0.15s, transform 0.1s; }
  .btn:active { transform: scale(0.98); opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #0f172a; }
  .btn-green { background: var(--green); color: #0f172a; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; border-radius: 6px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); cursor: pointer; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .alert { border-radius: var(--rs); padding: 10px 14px; font-size: 13px; margin-bottom: 12px; border-left: 3px solid; }
  .alert-warn { background: rgba(251,191,36,0.1); border-color: var(--warn); color: var(--warn); }
  .alert-green { background: rgba(52,211,153,0.1); border-color: var(--green); color: var(--green); }
  .alert-info { background: rgba(56,189,248,0.1); border-color: var(--accent); color: var(--accent); }
  .exp-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .exp-row:last-child { border-bottom: none; }
  .exp-cat { font-size: 11px; font-weight: 700; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .exp-note { font-size: 12px; color: var(--muted); }
  .exp-amt { font-size: 16px; font-weight: 700; }
  .del-btn { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; line-height: 1; }
  .del-btn:active { color: var(--danger); }
  .sum-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
  .sum-line:last-child { border-bottom: none; }
  .sum-line.bold { font-weight: 700; font-size: 15px; }
  .hist-item { background: var(--surface2); border-radius: var(--rs); padding: 12px; margin-bottom: 8px; }
  .hist-date-header { font-size: 12px; color: var(--muted); font-weight: 600; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .bdg-fuel { background: rgba(56,189,248,0.15); color: var(--accent); }
  .bdg-save { background: rgba(52,211,153,0.15); color: var(--green); }
  .bdg-cash { background: rgba(167,139,250,0.15); color: var(--accent2); }
  .bdg-sal { background: rgba(52,211,153,0.2); color: var(--green); }
  .big-num { font-size: 30px; font-weight: 800; letter-spacing: -1px; }
  .center { text-align: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 8px; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface2); color: var(--text); padding: 10px 22px; border-radius: 99px; font-size: 13px; opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 9999; white-space: nowrap; border: 1px solid var(--border); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .install-banner { background: linear-gradient(135deg, #1e3a5f, #1e293b); border: 1px solid var(--accent); border-radius: var(--r); padding: 14px; margin-bottom: 14px; display: none; }
  .install-banner.show { display: block; }
</style>
</head>
<body>

<div class="header">
  <h1>💸 <span>Paisa</span> Tracker</h1>
  <div class="header-sub" id="hdate"></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="nav('dashboard')">Dashboard</button>
  <button class="tab" onclick="nav('entry')">+ Entry</button>
  <button class="tab" onclick="nav('history')">History</button>
  <button class="tab" onclick="nav('setup')">Setup</button>
</div>

<!-- DASHBOARD -->
<div id="pg-dashboard" class="page active">
  <div id="dash"></div>
</div>

<!-- ENTRY -->
<div id="pg-entry" class="page">
  <div class="card">
    <div class="card-title">Record an Entry</div>
    <div class="form-group">
      <label>📅 Date (default: today)</label>
      <input type="date" id="edate" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--rs);padding:11px 12px;font-size:15px;outline:none;">
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="etype" onchange="etypeChange()">
        <option value="expense">💸 Expense (Petrol / Saving)</option>
        <option value="cashout">💳 Cash Out from Online Bank</option>
        <option value="salary">🎉 Received Salary</option>
        <option value="walletin">👛 Cash Received (into Wallet)</option>
        <option value="onlinein">🌐 Money Received (into Online Bank)</option>
      </select>
    </div>

    <div id="f-expense">
      <div class="form-group">
        <label>Budget Category</label>
        <select id="ecat">
          <option value="petrol">⛽ Petrol / Fuel</option>
          <option value="saving">💚 Saving (Food, etc.)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (Rs)</label>
        <input type="number" id="eamt" placeholder="e.g. 3230" inputmode="decimal">
      </div>
      <div class="form-group">
        <label>Note (optional)</label>
        <input type="text" id="enote" placeholder="e.g. Shell petrol, KFC lunch">
      </div>
      <div class="divider"></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">How did you pay? (select to update balance)</div>
      <div class="chk-row">
        <input type="checkbox" id="c-online">
        <label for="c-online">Paid from Online Bank (deduct from online balance)</label>
      </div>
      <div class="chk-row">
        <input type="checkbox" id="c-wallet">
        <label for="c-wallet">Paid from Wallet / Cash</label>
      </div>
    </div>

    <div id="f-cashout" style="display:none">
      <div class="alert alert-info">Money moves: Online Bank → Wallet. Online goes down, Wallet goes up.</div>
      <div class="form-group">
        <label>Amount to Cash Out (Rs)</label>
        <input type="number" id="coamt" placeholder="e.g. 5000" inputmode="decimal">
      </div>
    </div>

    <div id="f-salary" style="display:none">
      <div class="alert alert-green">Set salary amount and your budget split for this month.</div>
      <div class="form-group">
        <label>Salary Amount (Rs)</label>
        <input type="number" id="salamt" placeholder="e.g. 20000" inputmode="decimal">
      </div>
      <div class="form-group">
        <label>Received in</label>
        <select id="saldest">
          <option value="online">Online Bank</option>
          <option value="wallet">Cash / Wallet</option>
        </select>
      </div>
      <div class="row2">
        <div class="form-group">
          <label>⛽ Fuel Budget</label>
          <input type="number" id="salfuel" placeholder="e.g. 15000" inputmode="decimal">
        </div>
        <div class="form-group">
          <label>💚 Saving Budget</label>
          <input type="number" id="salsave" placeholder="e.g. 5000" inputmode="decimal">
        </div>
      </div>
    </div>

    <div id="f-walletin" style="display:none">
      <div class="form-group">
        <label>Amount (Rs)</label>
        <input type="number" id="wiamt" placeholder="e.g. 500" inputmode="decimal">
      </div>
      <div class="form-group">
        <label>Note</label>
        <input type="text" id="winote" placeholder="e.g. From friend">
      </div>
    </div>

    <div id="f-onlinein" style="display:none">
      <div class="form-group">
        <label>Amount (Rs)</label>
        <input type="number" id="oiamt" placeholder="e.g. 1000" inputmode="decimal">
      </div>
      <div class="form-group">
        <label>Note</label>
        <input type="text" id="oinote" placeholder="e.g. From friend, allowance">
      </div>
    </div>

    <button class="btn btn-primary" onclick="saveEntry()">✓ Save Entry</button>
  </div>
</div>

<!-- HISTORY -->
<div id="pg-history" class="page">
  <div class="form-group">
    <select id="hmonth" onchange="renderHistory()"></select>
  </div>
  <div id="hlist"></div>
</div>

<!-- SETUP -->
<div id="pg-setup" class="page">
  <div class="card">
    <div class="card-title">Correct Balances</div>
    <div class="row2">
      <div class="form-group"><label>Online Bank</label><input type="number" id="s-online" inputmode="decimal"></div>
      <div class="form-group"><label>Wallet / Cash</label><input type="number" id="s-wallet" inputmode="decimal"></div>
    </div>
    <div class="row2">
      <div class="form-group"><label>⛽ Fuel Left</label><input type="number" id="s-fuel" inputmode="decimal"></div>
      <div class="form-group"><label>💚 Saving Left</label><input type="number" id="s-save" inputmode="decimal"></div>
    </div>
    <button class="btn btn-green" onclick="doSetup()">Update Balances</button>
  </div>
  <div class="card">
    <div class="card-title">Monthly Budget Targets</div>
    <div class="row2">
      <div class="form-group"><label>Fuel Target</label><input type="number" id="s-fuelt" inputmode="decimal"></div>
      <div class="form-group"><label>Saving Target</label><input type="number" id="s-savet" inputmode="decimal"></div>
    </div>
    <button class="btn btn-primary" onclick="doTargets()">Save Targets</button>
  </div>
  <div class="card">
    <div class="card-title">Data</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn-sm" onclick="doExport()">📤 Export JSON</button>
      <button class="btn-sm" onclick="doImport()">📥 Import JSON</button>
      <button class="btn-sm" style="color:var(--danger);border-color:var(--danger);" onclick="doReset()">🗑 Reset Month</button>
    </div>
    <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importFile(event)">
  </div>
  <p style="text-align:center;color:var(--muted);font-size:11px;margin-top:16px;">Paisa Tracker v2.0 · Data saved on your phone</p>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── Data ───
const S = {
  g: k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } },
  s: (k,v) => localStorage.setItem(k, JSON.stringify(v))
};

function gs() {
  return S.g('pstate') || { online:0, wallet:0, fuel:0, save:0, fuelT:15000, saveT:5000, salary:0 };
}
function ss(s) { S.s('pstate', s); }
function gl() { return S.g('plogs') || []; }
function al(e) { const l=gl(); l.unshift(e); S.s('plogs',l); }

// ─── Helpers ───
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const todayInput = () => today();
const fmtD = d => new Date(d+'T00:00:00').toLocaleDateString('en-PK',{day:'numeric',month:'short',year:'numeric'});
const fmtM = m => { const [y,mo]=m.split('-'); return new Date(y,mo-1).toLocaleDateString('en-PK',{month:'long',year:'numeric'}); };
const fA = n => 'Rs ' + Math.round(n).toLocaleString();
const uid = () => Math.random().toString(36).substr(2,9);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

const catInfo = {
  petrol: { label:'⛽ Petrol/Fuel', cls:'bdg-fuel', col:'c-accent' },
  saving: { label:'💚 Saving',      cls:'bdg-save', col:'c-green' },
  cashout:{ label:'💳 Cash Out',    cls:'bdg-cash', col:'c-purple' },
  salary: { label:'💸 Salary',      cls:'bdg-sal',  col:'c-green' },
  walletin:{label:'👛 Wallet In',   cls:'bdg-sal',  col:'c-green' },
  onlinein:{label:'🌐 Online In',   cls:'bdg-sal',  col:'c-purple' }
};

// ─── Nav ───
function getEntryDate() {
  return document.getElementById('edate').value || today();
}

function nav(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('pg-'+name).classList.add('active');
  const i = {dashboard:0,entry:1,history:2,setup:3}[name];
  document.querySelectorAll('.tab')[i].classList.add('active');
  if(name==='entry') document.getElementById('edate').value = today();
  if(name==='dashboard') renderDash();
  if(name==='history') { populateMonths(); renderHistory(); }
  if(name==='setup') loadSetup();
}

// ─── Dashboard ───
function renderDash() {
  const s = gs();
  const total = s.online + s.wallet;
  const fuelUsed = s.fuelT - s.fuel;
  const saveUsed = s.saveT - s.save;
  const fuelPct = s.fuelT>0 ? Math.min(100,(fuelUsed/s.fuelT)*100) : 0;
  const savePct = s.saveT>0 ? Math.min(100,(saveUsed/s.saveT)*100) : 0;

  let alerts = '';
  if(s.fuel < s.fuelT*0.2 && s.fuelT>0)
    alerts += `<div class="alert alert-warn">⚠️ Fuel budget below 20% — only ${fA(s.fuel)} left!</div>`;
  if(s.save < s.saveT*0.2 && s.saveT>0)
    alerts += `<div class="alert alert-warn">⚠️ Saving budget low — only ${fA(s.save)} left!</div>`;

  const todayLogs = gl().filter(l=>l.date===today());
  let todayHtml = todayLogs.length === 0
    ? '<div class="empty" style="padding:16px 0;"><div class="empty-icon">📝</div>No entries today yet.</div>'
    : todayLogs.map(l => {
        const isIn = l.cat==='salary'||l.cat==='walletin'||l.cat==='onlinein';
        const ci = catInfo[l.cat]||{label:l.cat,cls:'bdg-cash',col:'c-text'};
        return `<div class="exp-row">
          <div style="flex:1">
            <div class="exp-cat ${ci.col}">${ci.label}</div>
            ${l.note?`<div class="exp-note">${l.note}</div>`:''}
            ${l.paidOnline?'<div class="exp-note" style="color:var(--accent);">Paid online</div>':''}
            ${l.paidWallet?'<div class="exp-note" style="color:var(--warn);">Paid from wallet</div>':''}
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="exp-amt ${isIn?'c-green':'c-danger'}">${isIn?'+':'-'}${fA(l.amount)}</span>
            <button class="del-btn" onclick="delEntry('${l.id}')">×</button>
          </div>
        </div>`;
      }).join('');

  document.getElementById('dash').innerHTML = `
    ${alerts}
    <div class="card">
      <div class="card-title">💰 My Money</div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">🌐 Online Bank</div><div class="stat-val c-purple">${fA(s.online)}</div></div>
        <div class="stat"><div class="stat-label">👛 Wallet / Cash</div><div class="stat-val c-warn">${fA(s.wallet)}</div></div>
      </div>
      <div class="center" style="padding:6px 0 2px;">
        <div style="font-size:12px;color:var(--muted);">Total Available</div>
        <div class="big-num c-text">${fA(total)}</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 Budget This Month</div>
      <div class="stat-grid">
        <div class="stat"><div class="stat-label">⛽ Fuel Remaining</div><div class="stat-val c-accent">${fA(s.fuel)}</div></div>
        <div class="stat"><div class="stat-label">💚 Saving Remaining</div><div class="stat-val c-green">${fA(s.save)}</div></div>
      </div>
      <div class="prog-wrap">
        <div class="prog-label"><span>⛽ Spent: ${fA(fuelUsed)}</span><span>${Math.round(fuelPct)}% of ${fA(s.fuelT)}</span></div>
        <div class="prog-bar"><div class="prog-fill pf-fuel" style="width:${fuelPct}%"></div></div>
      </div>
      <div class="prog-wrap">
        <div class="prog-label"><span>💚 Spent: ${fA(saveUsed)}</span><span>${Math.round(savePct)}% of ${fA(s.saveT)}</span></div>
        <div class="prog-bar"><div class="prog-fill pf-save" style="width:${savePct}%"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📅 Today — ${fmtD(today())}</div>
      ${todayHtml}
      <button class="btn btn-primary" style="margin-top:12px;" onclick="nav('entry')">+ Add Entry</button>
    </div>`;
}

// ─── Entry ───
function etypeChange() {
  const t = document.getElementById('etype').value;
  ['expense','cashout','salary','walletin','onlinein'].forEach(k => {
    document.getElementById('f-'+k).style.display = t===k?'':'none';
  });
}

function saveEntry() {
  const t = document.getElementById('etype').value;
  const s = gs();

  if(t==='expense') {
    const cat = document.getElementById('ecat').value;
    const amt = parseFloat(document.getElementById('eamt').value);
    const note = document.getElementById('enote').value.trim();
    const po = document.getElementById('c-online').checked;
    const pw = document.getElementById('c-wallet').checked;
    if(!amt||amt<=0){toast('⚠️ Enter a valid amount');return;}
    if(cat==='petrol') s.fuel = Math.max(0,s.fuel-amt);
    else s.save = Math.max(0,s.save-amt);
    if(po) s.online = Math.max(0,s.online-amt);
    if(pw) s.wallet = Math.max(0,s.wallet-amt);
    ss(s);
    al({id:uid(),date:getEntryDate(),cat,amount:amt,note,paidOnline:po,paidWallet:pw});
    toast('✓ Expense saved!');
    document.getElementById('eamt').value='';
    document.getElementById('enote').value='';
    document.getElementById('c-online').checked=false;
    document.getElementById('c-wallet').checked=false;

  } else if(t==='cashout') {
    const amt = parseFloat(document.getElementById('coamt').value);
    if(!amt||amt<=0){toast('⚠️ Enter amount');return;}
    if(amt>s.online){toast('❌ Not enough in online bank!');return;}
    s.online -= amt; s.wallet += amt;
    ss(s);
    al({id:uid(),date:getEntryDate(),cat:'cashout',amount:amt,note:'Cashed out from online bank'});
    toast('✓ Cash out recorded!');
    document.getElementById('coamt').value='';

  } else if(t==='salary') {
    const amt = parseFloat(document.getElementById('salamt').value);
    const dest = document.getElementById('saldest').value;
    const fuel = parseFloat(document.getElementById('salfuel').value)||0;
    const save = parseFloat(document.getElementById('salsave').value)||0;
    if(!amt||amt<=0){toast('⚠️ Enter salary amount');return;}
    if(dest==='online') s.online+=amt; else s.wallet+=amt;
    if(fuel>0){s.fuel=fuel;s.fuelT=fuel;}
    if(save>0){s.save=save;s.saveT=save;}
    s.salary=amt;
    ss(s);
    al({id:uid(),date:getEntryDate(),cat:'salary',amount:amt,note:`To ${dest} | Fuel budget: ${fA(fuel)} | Saving: ${fA(save)}`});
    toast('🎉 Salary recorded!');
    ['salamt','salfuel','salsave'].forEach(i=>document.getElementById(i).value='');

  } else if(t==='walletin') {    const amt = parseFloat(document.getElementById('wiamt').value);
    const note = document.getElementById('winote').value.trim();
    if(!amt||amt<=0){toast('⚠️ Enter amount');return;}
    s.wallet+=amt; ss(s);
    al({id:uid(),date:getEntryDate(),cat:'walletin',amount:amt,note});
    toast('✓ Wallet updated!');
    document.getElementById('wiamt').value='';
    document.getElementById('winote').value='';

  } else if(t==='onlinein') {
    const amt = parseFloat(document.getElementById('oiamt').value);
    const note = document.getElementById('oinote').value.trim();
    if(!amt||amt<=0){toast('⚠️ Enter amount');return;}
    s.online+=amt; ss(s);
    al({id:uid(),date:getEntryDate(),cat:'onlinein',amount:amt,note});
    toast('✓ Online balance updated!');
    document.getElementById('oiamt').value='';
    document.getElementById('oinote').value='';
  }

  nav('dashboard');
}

// ─── History ───
function populateMonths() {
  const logs=gl(), sel=document.getElementById('hmonth');
  const months=new Set(logs.map(l=>l.date.substring(0,7)));
  months.add(today().substring(0,7));
  const arr=[...months].sort().reverse();
  const cur=sel.value;
  sel.innerHTML=arr.map(m=>`<option value="${m}"${m===cur?'selected':''}>${fmtM(m)}</option>`).join('');
}

function renderHistory() {
  const m=document.getElementById('hmonth').value||today().substring(0,7);
  const logs=gl().filter(l=>l.date.startsWith(m));
  const el=document.getElementById('hlist');
  if(!logs.length){el.innerHTML='<div class="empty"><div class="empty-icon">📭</div>No entries this month.</div>';return;}

  let fp=0,sp=0,sal=0,co=0;
  logs.forEach(l=>{
    if(l.cat==='petrol') fp+=l.amount;
    else if(l.cat==='saving') sp+=l.amount;
    else if(l.cat==='salary') sal+=l.amount;
    else if(l.cat==='cashout') co+=l.amount;
  });

  let html=`<div class="card">
    <div class="card-title">Month Summary</div>
    <div class="sum-line"><span>💸 Salary</span><span class="c-green">${fA(sal)}</span></div>
    <div class="sum-line"><span>⛽ Fuel spent</span><span class="c-danger">${fA(fp)}</span></div>
    <div class="sum-line"><span>💚 Saving spent</span><span class="c-danger">${fA(sp)}</span></div>
    <div class="sum-line"><span>💳 Cashed out</span><span class="c-purple">${fA(co)}</span></div>
    <div class="sum-line bold"><span>Total Spent</span><span class="c-danger">${fA(fp+sp)}</span></div>
    <div class="sum-line bold"><span>Net Saved</span><span class="${sal-(fp+sp)>=0?'c-green':'c-danger'}">${fA(sal-(fp+sp))}</span></div>
  </div>`;

  const byDate={};
  logs.forEach(l=>{if(!byDate[l.date])byDate[l.date]=[];byDate[l.date].push(l);});
  Object.keys(byDate).sort().reverse().forEach(date=>{
    html+=`<div class="hist-date-header">${fmtD(date)}</div>`;
    byDate[date].forEach(l=>{
      const ci=catInfo[l.cat]||{label:l.cat,cls:'bdg-cash',col:'c-text'};
      const isIn=l.cat==='salary'||l.cat==='walletin'||l.cat==='onlinein';
      html+=`<div class="hist-item">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <span class="badge ${ci.cls}">${ci.label}</span>
            ${l.note?`<div style="font-size:12px;color:var(--muted);margin-top:4px;">${l.note}</div>`:''}
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <span style="font-weight:700;" class="${isIn?'c-green':'c-danger'}">${isIn?'+':'-'}${fA(l.amount)}</span>
            <button class="del-btn" onclick="delEntry('${l.id}')">×</button>
          </div>
        </div>
      </div>`;
    });
  });
  el.innerHTML=html;
}

function delEntry(id) {
  if(!confirm('Delete this entry?\n\nNote: Balances will NOT auto-reverse. Fix manually in Setup if needed.')) return;
  S.s('plogs', gl().filter(l=>l.id!==id));
  toast('Deleted');
  renderDash();
  if(document.getElementById('pg-history').classList.contains('active')) renderHistory();
}

// ─── Setup ───
function loadSetup() {
  const s=gs();
  document.getElementById('s-online').value=s.online;
  document.getElementById('s-wallet').value=s.wallet;
  document.getElementById('s-fuel').value=s.fuel;
  document.getElementById('s-save').value=s.save;
  document.getElementById('s-fuelt').value=s.fuelT;
  document.getElementById('s-savet').value=s.saveT;
}
function doSetup() {
  const s=gs();
  s.online=parseFloat(document.getElementById('s-online').value)||0;
  s.wallet=parseFloat(document.getElementById('s-wallet').value)||0;
  s.fuel=parseFloat(document.getElementById('s-fuel').value)||0;
  s.save=parseFloat(document.getElementById('s-save').value)||0;
  ss(s); toast('✓ Balances updated!');
}
function doTargets() {
  const s=gs();
  s.fuelT=parseFloat(document.getElementById('s-fuelt').value)||s.fuelT;
  s.saveT=parseFloat(document.getElementById('s-savet').value)||s.saveT;
  ss(s); toast('✓ Targets saved!');
}
function doReset() {
  if(!confirm('Reset all balances to zero? History is kept.')) return;
  const s=gs(); s.online=0;s.wallet=0;s.fuel=0;s.save=0;s.salary=0; ss(s);
  loadSetup(); toast('✓ Reset done');
}
function doExport() {
  const d={state:gs(),logs:gl(),exported:new Date().toISOString()};
  const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='paisa-'+today()+'.json'; a.click(); toast('📤 Exported!');
}
function doImport() { document.getElementById('imp-file').click(); }
function importFile(e) {
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{
    try {
      const d=JSON.parse(ev.target.result);
      if(d.state) ss(d.state);
      if(d.logs) S.s('plogs',d.logs);
      toast('✓ Imported!'); loadSetup();
    } catch(err) { toast('❌ Invalid file'); }
  };
  r.readAsText(f);
}

// ─── Service Worker ───
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ─── Init ───
document.getElementById('hdate').textContent = new Date().toLocaleDateString('en-PK',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('edate').value = today();
renderDash();
</script>
